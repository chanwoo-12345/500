<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 500일 Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a playful, tender gift between two people
   IDEA a year-end music recap story, retold from the couple's chat log
   PICTURE each slide draws its own figure: giant count, chat bubble, hour bars, daily spark, 500-day grid, sized hearts, a wall of ㅋ
   COLOUR setup on a soft blush ground with white panel and one pink accent; slides keep one flat field each; fixed palette
   TYPE Noto Sans KR 900 with tight tracking for numbers and titles, Noto Sans KR for text
   LAYOUT setup: title, three preview cards, form (two columns on laptop, stacked on phone); story: one phone-shaped stage */
:root{color-scheme:light;--bg:#fff4f6;--ink:#24101a;--soft:#6e4f5c;--line:#f0d6df;--pk:#ff4d7d;--pk2:#fff0f4}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,-apple-system,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
p,li,.txt,.cap{text-wrap:pretty}
h1,h2,.lab{text-wrap:balance}
.disp{font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:900;line-height:1.1;letter-spacing:-.045em;margin:0}
.fit,.nw{white-space:nowrap}
button{font:inherit;cursor:pointer}
.wrap{min-height:100%;max-width:460px;margin:0 auto;padding:clamp(40px,9vh,96px) max(20px,env(safe-area-inset-left,0px)) clamp(32px,6vh,64px);display:flex;flex-direction:column;justify-content:center;gap:clamp(28px,5vh,44px)}
.ttl{font-size:clamp(46px,14vw,68px);line-height:1.04;text-align:center}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{aspect-ratio:9/15;border-radius:18px;padding:12px 12px 14px;display:flex;flex-direction:column;box-shadow:0 18px 30px -16px rgba(60,10,30,.45)}
.card p{margin:0}
.card:nth-child(2){transform:translateY(-14px)}
.cbar{display:flex;gap:3px;margin-bottom:14px}
.cbar i{flex:1;height:2px;border-radius:1px;background:currentColor;opacity:.3}
.cbar i.on{opacity:1}
.cl{font-size:13px;font-weight:700;line-height:1.35}
.cv{font-size:clamp(20px,6.2vw,30px);margin-top:auto!important}
.act{display:grid;gap:12px}
.up{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:18px;background:var(--pk);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 14px 26px -14px rgba(255,77,125,.9);transition:transform .15s,filter .2s}
.up:hover{filter:brightness(1.05)}
.up:active{transform:scale(.98)}
.up.ov{filter:brightness(1.1);transform:scale(1.02)}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.sheet{background:#fff;border-radius:24px;padding:22px 20px 14px;box-shadow:0 24px 48px -30px rgba(120,20,60,.45)}
.names{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.names svg{fill:var(--pk)}
.primary{min-height:56px;border:0;border-radius:16px;background:var(--pk);color:#fff;font-weight:700;font-size:17px;padding:0 24px;margin-top:4px;transition:filter .2s}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.5;cursor:default}
.link{justify-self:center;min-height:44px;border:0;background:none;color:var(--soft);font-size:14px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,.up:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.f{display:grid;gap:6px;font-weight:700;font-size:15px}
.f input,.names input{font:inherit;font-size:16px;font-weight:500;min-height:48px;padding:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);width:100%;outline:0}
.names input{text-align:center;font-weight:700}
.f input:focus,.names input:focus{border-color:var(--pk);box-shadow:0 0 0 3px #ffd6e2}
.err{background:#2a0b18;color:#fff;border-radius:14px;padding:12px 14px;margin:0;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.sum{margin:0;font-size:14px;color:var(--soft);text-align:center;white-space:pre-line}
.sub{margin:-4px 0 0;font-size:13px;color:var(--soft)}
@media(max-height:660px){.wrap{padding-top:24px;padding-bottom:20px;gap:20px}.ttl{font-size:clamp(38px,11vw,52px)}.sheet{padding:16px 16px 6px;gap:10px}.primary{min-height:50px}}

#story{position:fixed;inset:0;background:#14060f;display:grid;place-items:center;z-index:10}
#stage{--sb:#ffc2d4;--si:#33091a;--sa:#ff4d7d;container-type:size;position:relative;width:min(100%,440px);height:100%;overflow:hidden;background:var(--sb);color:var(--si);transition:background-color .45s,color .45s}
@media(min-width:500px) and (min-height:640px){#stage{border-radius:24px;height:min(calc(100% - 32px),880px)}}
#bars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:56px;display:flex;gap:4px;z-index:3;pointer-events:none}
#bars i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--si) 28%,transparent)}
#bars i.on{background:var(--si)}
#close{position:absolute;top:calc(env(safe-area-inset-top,0px));right:2px;width:48px;height:44px;border:0;background:none;color:var(--si);font-size:20px;z-index:4}
#close:focus-visible{outline:2px solid currentColor;outline-offset:-6px;border-radius:12px}
#slide{position:absolute;inset:0;overflow:hidden!important;padding:calc(52px + env(safe-area-inset-top,0px)) 24px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;cursor:pointer;user-select:none;-webkit-user-select:none;overflow-y:auto}
#slide p{margin:0}
.lab{font-size:clamp(15px,4.2cqw,17px);font-weight:700}
.big{font-size:clamp(48px,21cqw,100px)}
.big2{font-size:clamp(40px,15cqw,76px)}
.mid{font-size:clamp(26px,9.5cqw,44px)}
.giant{font-size:clamp(110px,46cqw,200px);line-height:.9}
.u{font-size:.38em;margin-left:.12em;letter-spacing:-.02em}
.acc{color:var(--sa)}
.txt{font-size:clamp(15px,4.3cqw,17px)}
.foot{font-size:15px;opacity:.85}
.note{display:grid;gap:10px}
.in>*{animation:up .55s both}
.in>*:nth-child(2){animation-delay:.08s}
.in>*:nth-child(3){animation-delay:.16s}
.in>*:nth-child(4){animation-delay:.24s}
.in>*:nth-child(5){animation-delay:.32s}
.in>*:nth-child(n+6){animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.bub{align-self:flex-start;max-width:94%;background:var(--si);color:var(--sb);border-radius:24px 24px 24px 6px;padding:16px 20px;display:grid;gap:4px;white-space:pre-line;overflow-wrap:anywhere}
.bub b{font-size:14px;opacity:.85}
.bub span{font-size:clamp(17px,5cqw,20px);font-weight:700;line-height:1.45}
.shelf{display:flex;align-items:flex-end;gap:16px;margin-top:clamp(20px,6cqh,52px)}
.shelf svg{flex:none;height:auto;overflow:visible}
.shelf p{font-size:15px;line-height:1.45;padding-bottom:6px}
.shelf strong{display:block;font-size:clamp(19px,6cqw,23px);font-weight:900;letter-spacing:-.03em}
.cblock{display:flex;flex-direction:column;gap:16px}
.sp{display:block;flex:1 1 0;min-height:0}
.sp.b{flex-grow:1.8}
.sp.v{flex-grow:1.4}
@container (max-height:640px){#slide{gap:10px;padding-top:calc(46px + env(safe-area-inset-top,0px))}.cblock{gap:10px}.grid{gap:2px}.note{gap:6px}}
.cap{font-size:14px;opacity:.85}
.who{display:grid;gap:18px;margin-top:6px}
.wn{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:17px;margin-bottom:6px!important}
.wn span:last-child{white-space:nowrap}
.track{height:54px;border-radius:14px;background:color-mix(in srgb,var(--si) 20%,transparent);overflow:hidden}
.fill{height:100%;min-width:4.6em;border-radius:14px;background:var(--si);color:var(--sb);display:flex;align-items:center;padding:0 14px;font-weight:900;letter-spacing:-.03em;font-size:22px;white-space:nowrap;animation:grow .9s .2s both}
.fill.w{background:var(--sa)}
@keyframes grow{from{width:0}}
.hrs{display:flex;align-items:flex-end;gap:2px;height:clamp(140px,26vh,220px);margin-top:8px}
.hrs i{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--si) 32%,transparent);transform-origin:bottom;animation:rise .7s both}
.hrs i.pk{background:var(--sa)}
@keyframes rise{from{transform:scaleY(0)}}
.tk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:13px;opacity:.85;margin-top:-8px!important}
.viz{display:flex;flex-direction:column;gap:10px}
.vcap{font-size:13px;opacity:.8}
.spark{position:relative;height:clamp(96px,20cqh,170px);margin-top:26px}
.spark svg{position:absolute;inset:0;width:100%;height:100%}
.spark rect{fill:color-mix(in srgb,var(--si) 40%,transparent)}
.spark rect.pk{fill:var(--sa)}
.mk{position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--sa);transform:translateX(-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--sa) 25%,transparent)}
.mkl{position:absolute;top:-30px;width:4.4em;text-align:center;font-size:13px;font-weight:700;color:var(--sa);white-space:nowrap}
.plank{height:4px;border-radius:2px;background:var(--si);opacity:.75;margin-top:-10px}
.grid{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:3px;width:min(100%,47cqh)}
.grid i{border-radius:3px!important}
.grid i{aspect-ratio:1;border-radius:2px;background:color-mix(in srgb,var(--si) 12%,transparent)}
.grid i.a{background:color-mix(in srgb,var(--si) 50%,transparent)}
.grid i.s{background:var(--sa)}
.grid i.f{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--si) 22%,transparent)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:2px;display:inline-block}
.wl{display:grid;gap:14px;margin-top:6px}
.wr{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:4px 12px}
.wr .rk{font-size:28px}
.wr .ww{font-weight:900;font-size:clamp(18px,5.6cqw,22px);letter-spacing:-.02em;overflow-wrap:anywhere}
.wr:first-child .ww{font-size:clamp(22px,7.5cqw,30px)}
.wr .bar{grid-column:2/4;height:8px;border-radius:4px;background:var(--sa);animation:grow .8s .2s both}
.wr .c{font-weight:700;white-space:nowrap}
.lv{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px}
.hb{display:grid;place-items:center;height:64px}
.hb svg{fill:var(--sa)}
.lw{font-weight:900;font-size:22px}
.ls{font-size:14px;opacity:.85}
.lc{font-size:clamp(26px,10cqw,42px);white-space:nowrap}
.box{border:2px solid var(--si);border-radius:16px;padding:14px 16px;font-size:16px}
.lvl{display:grid;gap:12px}
@container (max-height:720px){.lvl{gap:4px}.hb{height:46px}.lw{font-size:18px}.ls{font-size:13px;line-height:1.4}.lc{font-size:clamp(24px,8.5cqw,34px)}.box{padding:10px 14px;font-size:14px}}
@container (max-height:600px){.lw{font-size:16px;line-height:1.3}.box{font-size:13px;line-height:1.45}.hb{height:40px}.hb svg{max-width:36px;max-height:36px}.lvl{gap:2px}}
.hb text{fill:var(--sb);font-weight:900;font-family:"Noto Sans KR",sans-serif}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kk{font-weight:900;font-size:clamp(16px,4.8cqw,19px);line-height:1.1;letter-spacing:1px;color:var(--sa);word-break:break-all;overflow:hidden;flex:1 1 auto;min-height:50px}
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.recap div{background:color-mix(in srgb,var(--si) 10%,transparent);border-radius:14px;padding:12px 14px}
.recap b{display:block;font-weight:900;letter-spacing:-.04em;font-size:clamp(20px,6.5cqw,26px);line-height:1.15;white-space:nowrap}
.recap span{font-size:14px}
.letter{font-size:clamp(18px,5.4cqw,21px);font-weight:500;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere}
.letter.short{white-space:pre;overflow-wrap:normal;font-size:clamp(30px,11cqw,54px);font-weight:900;line-height:1.2;letter-spacing:-.04em}
.sbtn{display:flex;gap:10px;flex-wrap:wrap}
.sbtn button{min-height:46px;border-radius:999px;border:2px solid var(--si);background:transparent;color:var(--si);font-weight:700;padding:0 18px}
.sbtn button:first-child{background:var(--si);color:var(--sb)}
@media(prefers-reduced-motion:reduce){.in>*,.fill,.hrs i,.wr .bar{animation:none}#stage{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="disp ttl">우리의 500일<br>Wrapped</h1>

  <div class="deck" id="deck" aria-hidden="true"></div>

  <section class="act" id="step1">
    <label class="up" id="drop" for="file">
      <input type="file" id="file" accept=".txt,.csv,.zip,text/plain,text/csv,application/zip" multiple>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M5 20h14"/></svg>
      <span>카톡 대화 불러오기</span>
    </label>
    <p class="err" id="err" hidden></p>
  </section>

  <section class="act sheet" id="step2" hidden>
    <p class="sum" id="sum"></p>
    <div class="names">
      <input type="text" id="nA" maxlength="12" aria-label="첫 번째 이름">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <input type="text" id="nB" maxlength="12" aria-label="두 번째 이름">
    </div>
    <label class="f">사귄 날<input type="date" id="start"></label>
    <p class="sub" id="d500"></p>
    <button type="button" class="primary" id="go">시작하기</button>
    <button type="button" class="link" id="reset">다른 파일 불러오기</button>
  </section>
</main>

<div id="story" hidden>
  <div id="stage">
    <div id="bars"></div>
    <button type="button" id="close" aria-label="닫기">✕</button>
    <div id="slide" role="region" aria-live="polite"></div>
  </div>
</div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const DAY=864e5;
const dn=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/DAY);
const ymd=n=>{const t=new Date(n*DAY);return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate(),t.getUTCDay()]};
const WD='일월화수목금토';
const p2=n=>String(n).padStart(2,'0');
const fDate=(n,w)=>{const [y,m,d,wd]=ymd(n);return `${y}년 ${m}월 ${d}일`+(w?` ${WD[wd]}요일`:'')};
const fDot=n=>{const [y,m,d]=ymd(n);return `${y}.${p2(m)}.${p2(d)}`};
const iso=n=>{const [y,m,d]=ymd(n);return `${y}-${p2(m)}-${p2(d)}`};
const fTime=(h,mi)=>`${h<12?'오전':'오후'} ${h%12||12}:${p2(mi)}`;
const hourName=h=>h===0?'밤 12시':h<6?`새벽 ${h}시`:h<12?`오전 ${h}시`:h===12?'낮 12시':h<18?`오후 ${h-12}시`:h<21?`저녁 ${h-12}시`:`밤 ${h-12}시`;
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};

/* ===== 마지막 장에 나오는 멘트: 이 따옴표(`) 사이만 바꾸면 돼요. 줄바꿈도 그대로 나와요. ===== */
const LETTER=`501일째도, 그다음 날도
잘 부탁해`;

/* ---------- parsing ---------- */
const RE_M=/^(\d{4})\s*(?:년|\.)\s*(\d{1,2})\s*(?:월|\.)\s*(\d{1,2})\s*(?:일|\.)?\s*(오전|오후)?\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*,\s*(.+?)\s:\s?(.*)$/;
const RE_PCDAY=/^-{3,}\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
const RE_PC=/^\[(.+?)\]\s\[(오전|오후)\s?(\d{1,2}):(\d{2})\]\s?(.*)$/;
const RE_CSV=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):\d{2},"?([^",]*)"?,"?(.*?)"?$/;
const RE_EN=/^([A-Z][a-z]+) (\d{1,2}), (\d{4})(?: at)? (\d{1,2}):(\d{2})(?:\s?([AP]M))?,\s*(.+?)\s:\s?(.*)$/;
const RE_SKIP=/카카오톡 대화$|^저장한 날짜|^Date,User,Message|^Talk_\d|^Saved on|KakaoTalk Chats/;
const RE_DSTART=/^\d{4}\s*(?:년|\.)\s*\d{1,2}\s*(?:월|\.)\s*\d{1,2}/;
const MON={January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};
const H=(ap,h)=>{h=+h;if(ap==='오후'||ap==='PM'){if(h<12)h+=12}else if((ap==='오전'||ap==='AM')&&h===12)h=0;return h};

function parse(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const out=[];let cur=null,pcDay=null,r;
  const push=(d,h,mi,s,m)=>{cur={d,h,mi:+mi,s:s.trim(),m};out.push(cur)};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');
    if(!l)continue;
    if((r=RE_M.exec(l))){push(dn(+r[1],+r[2],+r[3]),H(r[4],r[5]),r[6],r[7],r[8]);continue}
    if((r=RE_PCDAY.exec(l))){pcDay=dn(+r[1],+r[2],+r[3]);cur=null;continue}
    if(pcDay!==null&&(r=RE_PC.exec(l))){push(pcDay,H(r[2],r[3]),r[4],r[1],r[5]);continue}
    if((r=RE_CSV.exec(l))){push(dn(+r[1],+r[2],+r[3]),+r[4],r[5],r[6],r[7]);continue}
    if((r=RE_EN.exec(l))&&MON[r[1]]){push(dn(+r[3],MON[r[1]],+r[2]),H(r[6],r[4]),r[5],r[7],r[8]);continue}
    if(RE_SKIP.test(l)||RE_DSTART.test(l)){cur=null;continue}
    if(cur)cur.m+='\n'+l;
  }
  return out;
}

/* ---------- analysis ---------- */
const PH=/^(사진|사진 \d+장|동영상|음성메시지|삭제된 메시지입니다\.?|파일: .*|보이스톡.*|페이스톡.*|송금.*|샵검색: .*|지도: .*|Photo|Video|Emoticon)$/;
const media=m=>{if(m==='사진'||m==='Photo')return['p',1];const r=/^사진 (\d+)장$/.exec(m);if(r)return['p',+r[1]];if(/^\(?이모티콘\)?$|^Emoticon$/.test(m))return['e',1];return null};
const LOVE=[['l','사랑해',/사랑해|사랑행|사랑헤|싸랑해|사랑한다|사랑합니다|럽유|러뷰|love\s?you/gi],['m','보고싶어',/보고\s?싶|보구\s?싶|보고시퍼|보고파|보구파|miss\s?you/gi],['n','잘자',/잘\s?자(?![라란랐])|잘쟈|굿\s?밤|굿나잇|good\s?night/gi],['t','고마워',/고마워|고맙|고마웡|땡큐|thank\s?you/gi],['c','귀여워',/귀여워|귀엽|귀여운|귀요미|cute/gi]];
const STOP=new Set('그냥 진짜 너무 아니 그래 그럼 근데 그거 이거 저거 나도 나는 너는 너도 우리 그리고 그래서 그런데 지금 이제 뭐해 뭐야 응응 웅웅 어어 아아 오오 엉엉 그러면 그게 이게 저게 완전 약간 많이 정말 되게 엄청 혹시 일단 아직 다시 하고 해서 했어 하는 있어 없어 있는 같아 거야 거지 아니야 맞아 그치 그니까 그러니까 아냐 뭔가 그런 이런 저런 어떻게 언제 어디 여기 거기 저기 내가 너가 니가 나랑 너랑 하나 다들 아니면 그런가 그렇게 이렇게 저렇게 해야 하면 하지 했는데 하는데 그래도 그렇지 네네 넹넹 넵넵 오케이 ok 괜히 계속 별로 진심 사진 이모티콘 동영상 메시지입니다 삭제된'.split(' '));
const PART=['에서','이랑','한테','으로','은','는','을','를','가','도','랑','로','에'];
function toks(m){
  const out=[];
  for(let w of m.replace(/https?:\/\/\S+/g,' ').split(/[\s.,!?~…·"'`()[\]{}:;^*+=/\\|<>@#$%&_-]+/)){
    w=w.replace(/[^가-힣a-zA-Z0-9]/g,'');
    if(w.length<2||/^\d+$/.test(w))continue;
    for(const p of PART){if(w.length-p.length>=2&&w.endsWith(p)){w=w.slice(0,-p.length);break}}
    w=w.toLowerCase();
    if(!STOP.has(w))out.push(w);
  }
  return out;
}

function analyze(all,cfg){
  const start=cfg.start,end=start+499;
  const ms=all.filter(x=>x.d<=end);
  if(!ms.length)return null;
  const a=cfg.a,b=cfg.b;
  const per={a:{c:0,ch:0},b:{c:0,ch:0}};
  const hours=Array(24).fill(0),days=new Map(),wc=new Map();
  const love={};for(const [k] of LOVE)love[k]={t:0,a:0,b:0};
  let fl=null,ph=0,em=0,kk=0,chars=0;
  for(const x of ms){
    hours[x.h]++;days.set(x.d,(days.get(x.d)||0)+1);
    const who=x.s===a?'a':(b&&x.s===b)?'b':null;
    if(who)per[who].c++;
    let ls=x.m.split('\n');const md=media(ls[0].trim());
    if(md){if(md[0]==='p')ph+=md[1];else em++;ls=ls.slice(1)}
    const m=ls.join('\n').trim();
    if(!m||PH.test(m))continue;
    chars+=m.length;if(who)per[who].ch+=m.length;
    kk+=(m.match(/ㅋ/g)||[]).length;
    for(const [k,,re] of LOVE){const n=(m.match(re)||[]).length;if(n){love[k].t+=n;if(who)love[k][who]+=n;if(k==='l'&&!fl)fl={d:x.d,h:x.h,mi:x.mi,s:x.s}}}
    for(const w of toks(m))wc.set(w,(wc.get(w)||0)+1);
  }
  const ds=[...days.keys()].sort((p,q)=>p-q);
  const firstD=ds[0],lastD=ds[ds.length-1];
  let best={n:0,from:firstD,to:firstD},run=0,rs=0,prev=null;
  for(const d of ds){if(prev!==null&&d===prev+1)run++;else{run=1;rs=d}if(run>best.n)best={n:run,from:rs,to:d};prev=d}
  let bd=firstD,bc=0;for(const [d,c] of days)if(c>bc){bc=c;bd=d}
  let grid='',active=0;
  for(let i=0;i<500;i++){const d=start+i;let c='n';if(d>lastD)c='f';else if(days.has(d)){active++;c=(d>=best.from&&d<=best.to)?'s':'a'}grid+=c}
  const pick=x=>({d:x.d,h:x.h,mi:x.mi,s:x.s,m:x.m.length>160?x.m.slice(0,160)+'…':x.m});
  const night=[22,23,0,1,2].reduce((s,h)=>s+hours[h],0);
  return {start,end,a,b,total:ms.length,cut:all.length-ms.length,per,hours,night,firstD,lastD,
    span:lastD-firstD+1,activeAll:days.size,daily:ds.map(d=>[d,days.get(d)]),busy:{d:bd,c:bc},streak:best,grid,active,
    words:[...wc].sort((p,q)=>q[1]-p[1]).slice(0,40),love,fl,ph,em,kk,chars,first:pick(ms[0]),last:pick(ms[ms.length-1])};
}

const nm=o=>o===CFG.a?(CFG.na||o):o===CFG.b?(CFG.nb||o):o;

function showErr(msg){const e=$('#err');e.textContent=msg;e.hidden=!msg}

let NFILES=1;
function merge(lists){
  // 여러 파일을 시간 순서로 합치고, 두 파일에 겹쳐 들어간 같은 메시지만 한 번으로 셉니다
  const all=[];lists.forEach((l,f)=>l.forEach(x=>all.push([x,f])));
  all.sort((p,q)=>(p[0].d-q[0].d)||(p[0].h-q[0].h)||(p[0].mi-q[0].mi)||(p[1]-q[1]));
  const out=[],seen=new Map();
  for(const [x,f] of all){const k=x.d+'|'+x.h+'|'+x.mi+'|'+x.s+'|'+x.m;const g=seen.get(k);if(g!==undefined&&g!==f)continue;seen.set(k,f);out.push(x)}
  return out;
}
function load(texts){
  const text=texts[0]||'';
  const ms=texts.length>1?merge(texts.map(parse)):parse(text);
  NFILES=texts.length;
  if(ms.length<10){
    const head=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).slice(0,4).join('\n');
    showErr('메시지를 찾지 못했어요. 카톡에서 "대화 내보내기"로 저장한 .txt 파일인지 확인해 주세요.'+(head?'\n\n파일 첫 줄:\n'+head.slice(0,300):''));
    return;
  }
  showErr('');
  MSGS=ms;
  const cnt={};for(const x of ms)cnt[x.s]=(cnt[x.s]||0)+1;
  const top=Object.keys(cnt).sort((p,q)=>cnt[q]-cnt[p]).slice(0,2);
  const a=top.includes(ms[0].s)?ms[0].s:top[0],b=top.find(p=>p!==a)||'';
  CFG={a,b,na:a,nb:b,start:ms[0].d,ex:new Set()};
  $('#nA').value=a;
  $('#nB').value=b;
  $('#start').value=iso(CFG.start);
  recompute();
  $('#step1').hidden=true;$('#step2').hidden=false;$('#deck').hidden=true;
  $('#step2').scrollIntoView({block:'nearest'});
}

function recompute(){
  ST=analyze(MSGS,CFG);
  if(!ST){$('#sum').textContent='이 날짜 기준으로는 메시지가 없어요. 사귄 날을 확인해 주세요.';$('#go').disabled=true;return}
  $('#go').disabled=false;
  $('#sum').innerHTML=`<span class="nw">메시지 ${fmt(ST.total)}개</span> · <span class="nw">${fDot(ST.firstD)} ~ ${fDot(ST.lastD)}</span>`+(NFILES>1?`<br><span class="nw">파일 ${NFILES}개를 합쳤어요</span>`:'');
  $('#d500').innerHTML=`500일째 되는 날은 <span class="nw">${fDate(ST.end,true)}</span>이에요`+(ST.lastD<ST.end?`<br><span class="nw">대화 기록은 ${ST.lastD-ST.start+1}일째까지 있어요</span>`:'');
}

  const lm=Math.max(1,...LOVE.map(([k])=>s.love[k].t));
  const fl=s.fl;
  add(8,`<p class="lab">이 말, 몇 번이나 했을까</p><div class="cblock"><div class="lvl">${LOVE.filter(([k])=>s.love[k].t>0).sort((p,q)=>s.love[q[0]].t-s.love[p[0]].t).slice(0,5).map(([k,label],i)=>{const v=s.love[k],sz=Math.round(30+24*Math.sqrt(v.t/lm));return `<div class="lv"><div class="hb"><svg width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true">${HEART}<text x="12" y="14.6" text-anchor="middle" font-size="8.5">${i+1}</text></svg></div><div><p class="lw">${label}</p>${s.b?`<p class="ls"><span class="nw">${A} ${fmt(v.a)}</span> · <span class="nw">${Bn} ${fmt(v.b)}</span></p>`:''}</div><p class="disp lc"><span data-n="${v.t}">0</span><span class="u">번</span></p></div>`}).join('')}</div></div><div class="box">${fl?`첫 "사랑해"는 ${D(fl.d)} ${T(fl.h,fl.mi)}.<br>${esc(josa(nm(fl.s),'이','가'))} 먼저 말했어요.<br>${relS(fl.d)}.`:'아직 "사랑해"는 아껴두는 중이에요.'}</div>`);

  const U=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000],unit=U.find(u=>s.kk/u<=220)||1e6,g=Math.max(s.kk?1:0,Math.round(s.kk/unit));
  const cm=s.kk,mm=cm/100,len=mm>=1000?`${(mm/1000).toFixed(1)}km`:mm>=1?`${fmt(mm)}m`:`${fmt(cm)}cm`;
  const cmp=mm>555?'<br>롯데월드타워(555m)보다 높아요.':mm>237?'<br>N서울타워(237m)보다 높아요.':'';
  add(9,`<p class="lab">말로 다 못 한 것들</p><div class="cblock"><div class="pair"><div><p class="disp mid fit"><span data-n="${s.ph}">0</span><span class="u">장</span></p><p class="txt">주고받은 사진</p></div><div><p class="disp mid fit"><span data-n="${s.em}">0</span><span class="u">개</span></p><p class="txt">보낸 이모티콘</p></div></div><div style="margin-top:clamp(14px,4cqh,32px)"><p class="disp mid fit"><span data-n="${s.kk}">0</span><span class="u">개</span></p><p class="txt">보낸 ㅋ 글자 수</p></div></div><div class="viz"><div class="kk" aria-hidden="true">${'ㅋ'.repeat(g)}</div><p class="txt">ㅋ 하나를 1cm로 치면,<br>한 줄로 늘어놓았을 때 <span class="nw">${len}</span>예요.${cmp}</p></div>`);

  const tw=s.words[0]?s.words[0][0]:'-';
  add(10,`<p class="lab">한눈에 보는 우리의 500일</p><div class="cblock"><h2 class="disp mid">${A}${s.b?' ♥ '+Bn:''}</h2><div class="recap"><div><b class="fit">${fmt(s.total)}</b><span>주고받은 메시지</span></div><div><b class="fit">${fmt(s.streak.n)}일</b><span>최장 연속 대화</span></div><div><b class="fit">${fmt(s.love.l.t)}번</b><span>사랑해</span></div><div><b class="fit">${fmt(s.ph)}장</b><span>주고받은 사진</span></div><div><b class="fit">${fmt(s.kk)}개</b><span>ㅋ</span></div><div><b class="fit">${esc(tw)}</b><span>가장 많이 쓴 단어</span></div></div></div>`);

  const letter=LETTER.trim()||'앞으로도 잘 부탁해';
  add(11,`<p class="lab">${A}${s.b?' ♥ '+Bn:''} · 함께한 500일</p><div class="cblock"><p class="letter${letter.length<=36?' short fit':''}">${esc(letter)}</p></div><div class="sbtn"><button type="button" data-act="again">처음부터 다시</button><button type="button" data-act="close">설정으로</button></div>`);
  return out;
}

/* ---------- story player ---------- */
let SL=[],cur=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function countUp(root){
  root.querySelectorAll('[data-n]').forEach(el=>{
    const v=+el.dataset.n;
    if(RM.matches||v<5){el.textContent=fmt(v);return}
    const t0=performance.now(),D=1100;
    const step=t=>{const k=Math.min(1,(t-t0)/D);el.textContent=fmt(v*(1-(1-k)**3));if(k<1&&el.isConnected)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function fit(root){
  root.querySelectorAll('.fit').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),i=0;while(el.scrollWidth>el.clientWidth+1&&fs>16&&i<40){fs*=.94;el.style.fontSize=fs+'px';i++}});
}
function squeeze(el){
  const bs=[...el.querySelectorAll('.cblock,.viz')];if(!bs.length)return;bs.forEach(b=>b.style.zoom='');let z=1;
  while(el.scrollHeight>el.clientHeight+1&&z>.6){z-=.04;bs.forEach(b=>b.style.zoom=z)}
}
function show(){
  const sl=SL[cur],th=TH[sl.t],st=$('#stage'),el=$('#slide');
  st.style.setProperty('--sb',th[0]);st.style.setProperty('--si',th[1]);st.style.setProperty('--sa',th[2]);
  el.className='';el.innerHTML=sl.h;{const cb=el.querySelector('.cblock');if(cb){cb.insertAdjacentHTML('beforebegin','<i class="sp"></i>');cb.insertAdjacentHTML('afterend',el.querySelector('.viz')?'<i class="sp v"></i>':'<i class="sp b"></i>')}}el.querySelectorAll('[data-n]').forEach(n=>n.textContent=fmt(+n.dataset.n));fit(el);squeeze(el);void el.offsetWidth;el.className='in';el.scrollTop=0;
  $('#bars').querySelectorAll('i').forEach((b,i)=>b.classList.toggle('on',i<=cur));
  countUp(el);
}
function openStory(){
  CFG.na=$('#nA').value.trim();CFG.nb=$('#nB').value.trim();
  SL=slides();cur=0;
  $('#bars').innerHTML=SL.map(()=>'<i></i>').join('');
  $('#story').hidden=false;document.body.style.overflow='hidden';
  show();
}
function closeStory(){$('#story').hidden=true;document.body.style.overflow='';$('#go').focus({preventScroll:true})}
const go=k=>{const n=Math.max(0,Math.min(SL.length-1,cur+k));if(n!==cur){cur=n;show()}};

/* ---------- events ---------- */
function decodeText(buf){
  let t=new TextDecoder('utf-8').decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>20){try{t=new TextDecoder('euc-kr').decode(buf)}catch(e){}}
  return t;
}
/* zip: 큰 압축 파일(사진·동영상 포함)도 통째로 읽지 않고, 안에 있는 .txt만 꺼내 읽어요 */
const u16=(v,o)=>v.getUint16(o,true),u32=(v,o)=>v.getUint32(o,true),u64=(v,o)=>v.getUint32(o,true)+v.getUint32(o+4,true)*4294967296;
const part=async(f,a,b)=>new Uint8Array(await f.slice(a,b).arrayBuffer());
const dv=b=>new DataView(b.buffer,b.byteOffset,b.byteLength);
function zipName(b,flag){
  if(flag&2048)return new TextDecoder('utf-8').decode(b);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){try{return new TextDecoder('euc-kr').decode(b)}catch(x){return ''}}
}
async function isZip(f){const h=await part(f,0,4);return h.length===4&&h[0]===0x50&&h[1]===0x4b&&h[2]===3&&h[3]===4}
async function unzipTexts(f){
  const size=f.size,tl=Math.min(size,65557),tail=await part(f,size-tl,size),tv=dv(tail);
  let e=-1;for(let i=tail.length-22;i>=0;i--){if(tail[i]===0x50&&tail[i+1]===0x4b&&tail[i+2]===5&&tail[i+3]===6){e=i;break}}
  if(e<0)throw new Error('bad');
  let cnt=u16(tv,e+10),cdSize=u32(tv,e+12),cdOff=u32(tv,e+16);
  if(cnt===0xFFFF||cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF){
    if(e<20||u32(tv,e-20)!==0x07064b50)throw new Error('bad');
    const z=await part(f,u64(tv,e-12),u64(tv,e-12)+56),zv=dv(z);
    if(z.length<56||u32(zv,0)!==0x06064b50)throw new Error('bad');
    cnt=u64(zv,32);cdSize=u64(zv,40);cdOff=u64(zv,48);
  }
  const cd=await part(f,cdOff,cdOff+cdSize),v=dv(cd),list=[];
  for(let n=0,p=0;n<cnt&&p+46<=cd.length;n++){
    if(u32(v,p)!==0x02014b50)break;
    const flag=u16(v,p+8),method=u16(v,p+10),nl=u16(v,p+28),xl=u16(v,p+30),cl=u16(v,p+32);
    let cs=u32(v,p+20),us=u32(v,p+24),lo=u32(v,p+42);
    for(let q=p+46+nl,qe=q+xl;q+4<=qe;){const id=u16(v,q),sz=u16(v,q+2);if(id===1){let r=q+4;if(us===0xFFFFFFFF){us=u64(v,r);r+=8}if(cs===0xFFFFFFFF){cs=u64(v,r);r+=8}if(lo===0xFFFFFFFF){lo=u64(v,r);r+=8}}q+=4+sz}
    const name=zipName(cd.subarray(p+46,p+46+nl),flag);
    p+=46+nl+xl+cl;
    if(!/\.(txt|csv)$/i.test(name)||/(^|\/)(__MACOSX\/|\._)/.test(name))continue;
    if(flag&1)throw new Error('enc');
    list.push({name,method,cs,lo});
  }
  list.sort((a,b)=>a.name.localeCompare(b.name));
  const texts=[];
  for(const en of list){
    const lh=await part(f,en.lo,en.lo+30);if(lh.length<30||u32(dv(lh),0)!==0x04034b50)continue;
    const st=en.lo+30+u16(dv(lh),26)+u16(dv(lh),28),blob=f.slice(st,st+en.cs);
    let buf;
    if(en.method===0)buf=await blob.arrayBuffer();
    else if(en.method===8){if(typeof DecompressionStream==='undefined')throw new Error('nods');buf=await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()}
    else continue;
    texts.push(decodeText(buf));
  }
  return texts;
}
async function take(list){
  const files=[...(list||[])];
  if(!files.length)return;
  const lbl=$('#drop span'),old=lbl.textContent;lbl.textContent='불러오는 중…';showErr('');
  const texts=[],bad=[];
  for(const f of files){
    try{
      if(await isZip(f)){const t=await unzipTexts(f);if(t.length)texts.push(...t);else bad.push(`${f.name}: 안에 대화(.txt) 파일이 없어요`)}
      else texts.push(decodeText(await f.arrayBuffer()));
    }catch(e){
      bad.push(`${f.name}: `+(e.message==='nods'?'이 브라우저는 압축 파일을 못 열어요. 압축을 풀고 .txt를 골라 주세요':e.message==='enc'?'암호가 걸린 압축 파일이에요':'읽지 못했어요'));
    }
  }
  lbl.textContent=old;
  if(!texts.length){showErr('대화 파일을 찾지 못했어요.\n'+bad.join('\n'));return}
  load(texts);
}
$('#file').addEventListener('change',e=>{take(e.target.files);e.target.value=''});
const drop=$('#drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('ov')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('ov')}));
document.addEventListener('drop',e=>{if(!$('#step1').hidden&&e.dataTransfer.files.length)take(e.dataTransfer.files)});
$('#reset').addEventListener('click',()=>{MSGS=ST=null;$('#step2').hidden=true;$('#step1').hidden=false;$('#deck').hidden=false});
$('#start').addEventListener('change',e=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);if(m){CFG.start=dn(+m[1],+m[2],+m[3]);recompute()}});
$('#go').addEventListener('click',()=>{if(ST)openStory()});
$('#close').addEventListener('click',closeStory);
$('#slide').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b){if(b.dataset.act==='again'){cur=0;show()}else if(b.dataset.act==='close')closeStory();return}
  const r=e.currentTarget.getBoundingClientRect();
  go(e.clientX-r.left<r.width*.35?-1:1);
});
document.addEventListener('keydown',e=>{
  if($('#story').hidden)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
  else if(e.key==='Escape')closeStory();
});

preview();fit($('#deck'));
const refit=new ResizeObserver(()=>{fit($('#deck'));if(!$('#story').hidden){fit($('#slide'));squeeze($('#slide'))}});refit.observe(document.body);refit.observe($('#stage'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fit($('#deck'));if(!$('#story').hidden)fit($('#slide'))});
}
</script>
